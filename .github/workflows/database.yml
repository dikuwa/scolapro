name: Database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start local database and apply migrations
        run: supabase db start

      - name: Reset database and verify seed
        run: supabase db reset

      - name: Lint database
        run: supabase db lint --local --level error

      - name: Run database tests
        run: supabase test db

      - name: Verify no-invitation HOD appointment transaction (Issue 1191)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f tests/sql/issue-1191-operational-hod-local-transaction.sql

      - name: Verify staff pre-invitation multi-role plan (Issue 1202)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f tests/sql/issue-1202-staff-preinvitation-roles-transaction.sql
