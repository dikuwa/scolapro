name: Production Auth URL Config

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Choose PREVIEW to inspect current URL config or DEPLOY to apply the governed production values."
        required: true
        type: choice
        options:
          - PREVIEW
          - DEPLOY

permissions:
  contents: read

concurrency:
  group: scolapro-production-auth-url-config
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jhgumnvhoxmapmgotchu
      SITE_URL: https://scola-pro.vercel.app
      URI_ALLOW_LIST: http://localhost:3000/**,https://scola-pro.vercel.app/**,https://*-martin-mukoyas-projects.vercel.app/**

    steps:
      - name: Require production management credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          }

      - name: Read current Auth URL configuration
        shell: bash
        run: |
          set -euo pipefail
          curl             --fail-with-body             --silent             --show-error             --retry 2             --retry-delay 2             --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             > /tmp/current-auth-config.json

          echo "Current production Auth URL configuration:"
          jq '{site_url, uri_allow_list}' /tmp/current-auth-config.json

      - name: Build governed Auth URL payload
        shell: bash
        run: |
          set -euo pipefail
          jq             --null-input             --arg site_url "$SITE_URL"             --arg uri_allow_list "$URI_ALLOW_LIST"             '{site_url: $site_url, uri_allow_list: $uri_allow_list}'             > /tmp/desired-auth-config.json

          test "$(jq 'keys | length' /tmp/desired-auth-config.json)" -eq 2
          jq -e 'has("site_url") and has("uri_allow_list")' /tmp/desired-auth-config.json >/dev/null

          echo "Governed production Auth URL configuration:"
          jq . /tmp/desired-auth-config.json

      - name: Apply governed Auth URL configuration
        if: ${{ inputs.confirmation == 'DEPLOY' }}
        shell: bash
        run: |
          set -euo pipefail
          curl             --fail-with-body             --silent             --show-error             --retry 2             --retry-delay 2             --request PATCH             --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             --header "Content-Type: application/json"             --data-binary @/tmp/desired-auth-config.json             "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             > /tmp/auth-config-update.json

          echo "Management API response for governed fields:"
          jq '{site_url, uri_allow_list}' /tmp/auth-config-update.json

      - name: Verify deployed Auth URL configuration
        if: ${{ inputs.confirmation == 'DEPLOY' }}
        shell: bash
        run: |
          set -euo pipefail
          curl             --fail-with-body             --silent             --show-error             --retry 2             --retry-delay 2             --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             > /tmp/verified-auth-config.json

          jq -e             --arg site_url "$SITE_URL"             --arg uri_allow_list "$URI_ALLOW_LIST"             '.site_url == $site_url and .uri_allow_list == $uri_allow_list'             /tmp/verified-auth-config.json             >/dev/null

          echo "Verified production Auth URL configuration:"
          jq '{site_url, uri_allow_list}' /tmp/verified-auth-config.json
