name: Report-card worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-card-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      REPORT_CARD_WORKER_URL: ${{ vars.REPORT_CARD_WORKER_URL }}
      INTERNAL_JOB_RUNNER_SECRET: ${{ secrets.INTERNAL_JOB_RUNNER_SECRET }}

    steps:
      - name: Check worker configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$REPORT_CARD_WORKER_URL" || -z "$INTERNAL_JOB_RUNNER_SECRET" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Report-card worker scheduler is not configured. Set repository variable REPORT_CARD_WORKER_URL and repository secret INTERNAL_JOB_RUNNER_SECRET."
            exit 0
          fi

          case "$REPORT_CARD_WORKER_URL" in
            https://*) ;;
            *)
              echo "::error::REPORT_CARD_WORKER_URL must use https://"
              exit 1
              ;;
          esac

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Drain durable report-card queues
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          curl             --fail-with-body             --silent             --show-error             --max-time 55             --retry 2             --retry-delay 5             --request POST             --header "Authorization: Bearer $INTERNAL_JOB_RUNNER_SECRET"             --header "Content-Type: application/json"             "$REPORT_CARD_WORKER_URL"
